<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-label="BitBloc mascote">
  <rect width="640" height="640" fill="#ffffff" rx="48"/>
  <!-- blocks cluster -->
  <g stroke="#071525" stroke-width="6" stroke-linejoin="round">
    <g transform="translate(150 210)">
      <path fill="#f0b91a" d="M0 70l70-36 70 36v72l-70 36-70-36z"/>
      <path fill="#2a7be8" d="M0 142l70-36 70 36v72l-70 36-70-36z"/>
      <path fill="#a8b0bc" d="M0 214l70-36 70 36v72l-70 36-70-36z"/>
