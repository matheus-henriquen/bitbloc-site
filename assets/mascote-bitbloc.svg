    <path d="M270 290c-40 35-70 90-55 140" fill="none" stroke="#071525" stroke-width="6" stroke-linecap="round"/>
    <path d="M300 220c20 5 25 30 10 45" fill="none" stroke="#f0b91a" stroke-width="18" stroke-linecap="round"/>
    <path d="M390 300c25 10 45 35 35 55" fill="none" stroke="#f0b91a" stroke-width="18" stroke-linecap="round"/>
